# confmcp 오프라인 배포용 구성.
#
# 새로 설치:
#   docker load -i confmcp-v0.1.0.tar.gz
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# 업그레이드: deploy/upgrade.sh confmcp-v<새 버전>.tar.gz
#   이미지만 적재하고 up -d 하면 deploy/.env 의 예전 CONFMCP_VERSION 으로 예전
#   이미지가 계속 돕니다. 수동으로 할 때는 CONFMCP_VERSION 을 먼저 바꾸십시오.
#
# 환경변수는 네 개만 사용합니다. 나머지 설정(Keycloak, Confluence, 권한 플러그인, AI, 정책)은
# 모두 관리자 콘솔에서 입력하며 AES-256-GCM 으로 암호화되어 저장됩니다.

services:
  postgres:
    image: postgres:17-alpine
    container_name: confmcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-confmcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 설정하십시오}
      POSTGRES_DB: ${POSTGRES_DB:-confmcp}
      TZ: Asia/Seoul
    volumes:
      - confmcp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-confmcp} -d ${POSTGRES_DB:-confmcp}"]
      interval: 10s
      timeout: 5s
      retries: 10

  confmcp:
    image: confmcp:v${CONFMCP_VERSION:-0.1.0}
    container_name: confmcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-confmcp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-confmcp}?sslmode=disable
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD 를 설정하십시오}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY 를 설정하십시오 (32바이트)}
      CONFMCP_ADDR: ":8080"
      TZ: Asia/Seoul
    ports:
      - "${CONFMCP_PORT:-8080}:8080"

volumes:
  confmcp-pgdata:
